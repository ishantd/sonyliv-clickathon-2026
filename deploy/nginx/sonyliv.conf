# nginx front for the demo box.
#
#   sudo cp deploy/nginx/sonyliv.conf /etc/nginx/conf.d/sonyliv.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ONE public listener, four surfaces:
#
#   :443 /         LibreChat            127.0.0.1:3080   (docker)
#   :443 /build/   fleet dashboard      127.0.0.1:8081   (sonyliv-mock, systemd)
#   :443 -> link   ClickStack dashboards  (ClickHouse Cloud, off-box)
#   :443 -> link   Langfuse traces        (cloud.langfuse.com, off-box)
#
#   :8443          the same fleet dashboard, kept as a fallback -- see below.
#
# WHY ONE PORT NOW, WHEN THIS FILE USED TO ARGUE FOR TWO. The old note said "LibreChat has
# no base-path support, so it takes the root and the dashboard moves to :8443". The first
# half is still true and was re-verified: danny-avila/LibreChat#5702 and discussion #2406
# both ask for exactly this and are open and unanswered, and DOMAIN_CLIENT/DOMAIN_SERVER
# only affect absolute URLs LibreChat generates, not where its client fetches its bundle.
#
# The conclusion was wrong though, because it treated both apps as equally immovable. The
# fleet dashboard is OURS and it is Next.js, where basePath is a first-class feature. So the
# app that CAN move is the one that moves: LibreChat keeps the root untouched and the
# dashboard is built with NEXT_PUBLIC_BASE_PATH=/build.
#
# That is worth the swap because :8443 was never actually reachable -- measured 000, no
# route, because the security group only opens 443. A second port needs a rule the demo did
# not have; a second PATH needs nothing. Nginx matches `location /build/` before the
# catch-all `location /`, so no sub_filter and no rewriting of hashed asset names.
#
# The :8443 server block stays. It costs nothing, it is how the box is reachable if a rule
# does get added, and removing a working path while changing the routing model would mean
# debugging two things at once.
#
# Nothing on this box now binds a public port directly; both upstreams are on loopback and
# nginx is the only TLS terminator. Reverting is two lines in /etc/sonyliv/sonyliv.env plus
# `systemctl restart sonyliv-mock`.

# TLS is a real Let's Encrypt certificate now, issued over TLS-ALPN-01 by lego.
#
# It is one bundled SAN cert for fastandfurious.live and www.fastandfurious.live,
# issued by "Let's Encrypt YE2", and it lives in /etc/lego/certificates/. lego puts
# the leaf and its chain in the single .crt file -- four PEM blocks -- which is what
# ssl_certificate wants, so there is no separate fullchain to assemble.
#
# WHY LEGO AND NOT CERTBOT. certbot was installed first and cannot do the job. The
# only challenge that works on this box is TLS-ALPN-01, and certbot has never
# implemented it: `certbot plugins --standalone` describes itself as "HTTP challenge
# only", and the string tls-alpn appears nowhere in `certbot help all`. Asking for it
# anyway fails with "None of the preferred challenges are supported by the selected
# plugin". lego does implement it, via --tls, and it is packaged in Ubuntu, so it
# needs no piping of a remote install script into a root shell.
#
# WHY NOT HTTP-01, WHICH WOULD BE CHEAPER. The security group opens 443 and nothing
# else, so the challenge cannot arrive on :80. That is not read off this config --
# Let's Encrypt said it, reaching the correct host and then giving up on the port:
#
#   Detail: 3.7.142.50: Fetching http://fastandfurious.live/.well-known/acme-...
#           Timeout during connect (likely firewall problem)
#
# WHY NOT DNS-01, WHICH NEEDS NO PORTS AT ALL. The zone is not reachable from here.
# fastandfurious.live delegates to ns35/ns36.domaincontrol.com and RDAP names GoDaddy
# as the registrar, and there is no GoDaddy or Cloudflare credential in .env, in this
# repo, or on the box. If one ever appears, DNS-01 is strictly better than what we do
# below, because it needs no downtime.
#
# WHAT TLS-ALPN-01 COSTS. The solver has to own :443, so nginx stops while it runs --
# measured at roughly thirty seconds for the staging and production runs together.
# That is survivable a few times a year but not daily, which is why renewal is not a
# bare `lego renew` on a timer. deploy/tls-renew.sh checks the expiry first and only
# takes nginx down when a renewal is genuinely due.
#
# The old self-signed pair is still at /etc/sonyliv/tls/ and no longer referenced. It
# was CN=sonyliv-api with SANs for the private IP and localhost, which is why every
# visit to the real domain used to throw an interstitial.

# $connection_upgrade is not a built-in. It must be defined at http scope, which is what
# conf.d/*.conf is included into -- a `map` inside a server block is a config error. It
# resolves to "upgrade" for a websocket handshake and "close" otherwise; hardcoding
# `Connection: upgrade` on every request instead breaks keepalive for ordinary ones.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream librechat {
    server 127.0.0.1:3080;
    keepalive 32;
}

upstream sonyliv_mock {
    server 127.0.0.1:8081;
    keepalive 16;
}

# Plain HTTP, for two jobs it cannot do from :443. Both are currently unreachable
# from outside, and it is worth being blunt about that rather than leaving the note
# below sounding like it works: the security group opens 443 only, so `curl
# http://3.7.142.50/` times out from a laptop and Let's Encrypt timed out the same
# way. On the box, where :80 is of course reachable, both behaviours were verified --
# /.well-known/acme-challenge/<file> returns its contents, and /anything returns
# 301 -> https://fastandfurious.live/anything. The block stays because it is correct
# and free, and it is what makes the demo behave the moment a rule is added.
#
# TYPING THE HOST. A browser given a bare hostname tries :80 before :443, or falls
# back to it. With nothing listening, the tab hangs on a connection timeout rather
# than showing anything -- which reads as "the site is down" and not as "use https".
# This redirects instead, so `fastandfurious.live` in the URL bar lands on the demo.
#
# GETTING A REAL CERTIFICATE. Let's Encrypt's HTTP-01 challenge is served from
# /.well-known/acme-challenge over :80, which is why that path is excluded from the
# redirect: redirecting it to https would fail validation against the very cert it is
# trying to replace. Nothing uses this today -- the cert was issued over TLS-ALPN-01
# on :443 instead, for the reasons above -- but HTTP-01 is the challenge to come back
# to if :80 ever opens, because unlike TLS-ALPN-01 it renews without stopping nginx.
#
# 301 rather than 308: the demo has no POST that arrives on :80.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # The real names, then the catch-all. Naming them changes nothing about what this
    # block serves -- it is the only :443 server, so it is the default server and
    # answers every Host regardless -- but it records which names the certificate
    # actually covers, which is otherwise only discoverable by reading the cert.
    # Reaching the box by raw IP still works and still warns, because the cert has no
    # IP SAN. That is expected: it is how a public CA works, not a regression.
    server_name fastandfurious.live www.fastandfurious.live _;

    ssl_certificate     /etc/lego/certificates/fastandfurious.live.crt;
    ssl_certificate_key /etc/lego/certificates/fastandfurious.live.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # File uploads and, more to the point, long agent responses. The default 1m rejects
    # nothing here, but 0 removes a class of surprise from a demo.
    client_max_body_size 25m;

    # The fleet dashboard, mounted under a prefix.
    #
    # ORDER IS NOT WHY THIS WORKS -- nginx picks the LONGEST matching prefix, not the
    # first -- but keeping it above `location /` matches how it reads.
    #
    # The TRAILING SLASH on proxy_pass is the load-bearing character: it strips /build/
    # from the upstream request, so /build/_next/x.js reaches the Go server as
    # /_next/x.js. That is deliberate rather than incidental -- the Go binary serves its
    # embedded export from root and knows nothing about the prefix, so the same binary
    # works behind this proxy and standing alone on :8443. Drop the slash and every asset
    # 404s as /build/_next/x.js against a server that has no /build.
    #
    # The app's own fetches are the other half. basePath rewrites links and assets but not
    # fetch() strings, so the build also sets NEXT_PUBLIC_API_BASE=/build. Without it the
    # app would request /api/... at the root, which on this box is LibreChat's API -- it
    # would not 404, it would reach the wrong service and fail confusingly.
    location /build/ {
        proxy_pass http://sonyliv_mock/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The fleet views poll every five seconds and the curve endpoint runs a window
        # function over the fleet. Same reasoning as the LibreChat block.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # /build with no trailing slash would fall through to LibreChat, which answers 200
    # with its own SPA shell -- the most confusing possible failure, because the URL looks
    # right and the wrong app renders. Redirect instead.
    location = /build {
        return 301 /build/;
    }

    location / {
        proxy_pass http://librechat;
        proxy_http_version 1.1;

        # LibreChat streams tokens over SSE and uses websockets for the run panel. Without
        # the upgrade headers the UI connects and then silently never updates.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The two that matter for streaming. With buffering on, nginx holds the SSE chunks
        # and the answer arrives in one lump at the end -- indistinguishable from a hang,
        # and the single most common way this deployment looks broken when it is not.
        proxy_buffering off;
        proxy_cache off;

        # A tool loop against a cold ClickHouse service can sit quiet for a while: the MCP
        # server allows 60s per request and LiteLLM 120s. Anything below that turns a slow
        # answer into a 504.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/lego/certificates/fastandfurious.live.crt;
    ssl_certificate_key /etc/lego/certificates/fastandfurious.live.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://sonyliv_mock;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The fleet views poll on a five-second interval and the curve endpoint can run a
        # window-function query over a large fleet. Same reasoning as above.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
